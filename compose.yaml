name: keystone

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: keystone
      POSTGRES_PASSWORD: keystone
      POSTGRES_DB: keystone
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone -d keystone"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Lavalink 4.2 owns voice (including DAVE) and direct http(s) audio. It is a
  # separate process from the bot, so a node crash cannot take the gateway down.
  # The bundled config enables the http source only; no scraper is installed.
  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4.2.2
    environment:
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-keystone-lavalink}
    volumes:
      - ./lavalink/application.yml:/opt/Lavalink/application.yml:ro
    ports:
      - "2333:2333"
    restart: unless-stopped

  # Migrations run once, explicitly, before anything that reads the schema.
  migrate:
    build: .
    command: ["node", "dist/migrate.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://keystone:keystone@postgres:5432/keystone
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    build: .
    command: ["node", "dist/bot.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://keystone:keystone@postgres:5432/keystone
      REDIS_URL: redis://redis:6379
      LAVALINK_URL: lavalink:2333
      LAVALINK_PASSWORD: ${LAVALINK_PASSWORD:-keystone-lavalink}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      lavalink:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://keystone:keystone@postgres:5432/keystone
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # The dashboard/API is optional: a gateway-only self-host can omit this
  # service and still run the bot and worker. It refuses to boot in production
  # without SESSION_SECRET, and /login returns 503 until the OAuth values are set.
  web:
    build: .
    command: ["node", "dist/web.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://keystone:keystone@postgres:5432/keystone
      # The bus must reach the same Redis the bot uses; the .env default is
      # localhost, which inside this container is the web process itself.
      REDIS_URL: redis://redis:6379
      WEB_PORT: "3000"
      WEB_ORIGIN: http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
